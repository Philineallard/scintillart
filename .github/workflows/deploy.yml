# Publishes scintillart.com to Cloudflare Pages whenever main changes (a merged pull
# request), or by hand from the Actions tab ("Run workflow").
# Needs one repository secret: CLOUDFLARE_API_TOKEN (Cloudflare token with
# "Cloudflare Pages: Edit"). Agreed with Igor before enabling (CLAUDE.md: deploys).
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Wrangler compiles functions/ (the register form) itself, so no _worker.js is needed here.
      - name: Publish to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name scintillart --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0257356d56f572e67abed4924c4a3e0d
